# Jujutsu (jj) Configuration
# Inspired by Mitchell Hashimoto's jujutsu.toml workflow

[aliases]
b = ["branch"]
n = ["new"]

# Move the closest bookmark to the parent commit (@-).
# Useful when working on a named branch, creating commits, and updating the bookmark before pushing.
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]

# Rebase the current branch onto trunk().
retrunk = ["rebase", "-d", "trunk()"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"fork_history(to, from)" = "fork_point(to | from)..@"

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"

[ui]
default-command = "log"
